<form
  method="post"
  action="{% url 'favorites' %}"
  hx-post="{% url 'favorites' %}"
  hx-target="#favorites-list"
  hx-swap="outerHTML"
>
  {% csrf_token %}
  <input type="hidden" name="name" value="{{ place.name }}">
  <input type="hidden" name="state" value="{{ place.state }}">
  <input type="hidden" name="country" value="{{ place.country }}">
  <input type="hidden" name="lat" value="{{ place.lat }}">
  <input type="hidden" name="lon" value="{{ place.lon }}">
  <button type="submit" class="btn btn-ghost btn-xs" aria-label="Save {{ place.label }} to favorites">☆ Save</button>
</form>
