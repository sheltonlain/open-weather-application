{% extends "base.html" %}

{% block title %}Register · Open Weather App{% endblock %}

{% block content %}
<div class="card bg-base-100 shadow max-w-md mx-auto">
  <div class="card-body">
    <h1 class="card-title text-2xl">Create an account</h1>
    <form method="post" class="space-y-3">
      {% csrf_token %}
      {% include "accounts/partials/form_fields.html" %}
      <button type="submit" class="btn btn-primary w-full">Register</button>
    </form>
    <p class="text-sm">Already have an account? <a href="{% url 'login' %}" class="link">Log in</a></p>
  </div>
</div>
{% endblock %}
