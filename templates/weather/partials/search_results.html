<div id="search-results">
  {% if error %}
  <div role="alert" class="alert alert-warning">{{ error }}</div>
  {% elif not query %}
  <p class="text-base-content/70">Type a city name to search.</p>
  {% elif places %}
  <ul class="menu w-full rounded-box bg-base-200">
    {% for place in places %}
    <li>
      <span>{{ place.name }}{% if place.state %}, {{ place.state }}{% endif %}, {{ place.country }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="text-base-content/70">No results found for "{{ query }}".</p>
  {% endif %}
</div>
