<form
  method="get"
  action="{% url 'search' %}"
  hx-get="{% url 'search' %}"
  hx-target="#search-results"
  hx-swap="outerHTML"
  class="join w-full"
>
  <input
    type="search"
    name="q"
    value="{{ query|default:'' }}"
    placeholder="City or ZIP, e.g. Paris or 10001"
    aria-label="Search for a city or ZIP code"
    autocomplete="off"
    class="input input-lg join-item w-full shadow-sm"
  >
  <button type="submit" class="btn btn-primary btn-lg join-item">Search</button>
</form>
