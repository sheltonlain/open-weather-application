{% load tailwind_cli django_htmx %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Open Weather App{% endblock %}</title>
  {% tailwind_css %}
  {% htmx_script %}
</head>
<body class="min-h-screen bg-base-200" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="navbar bg-base-100 shadow-sm">
    <div class="flex-1">
      <a href="{% url 'dashboard' %}" class="btn btn-ghost text-xl">Open Weather</a>
    </div>
    <nav class="flex items-center gap-2">
      {% if user.is_authenticated %}
      <span class="font-medium">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
      </form>
      {% else %}
      <a href="{% url 'login' %}" class="btn btn-ghost btn-sm">Log in</a>
      <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Register</a>
      {% endif %}
    </nav>
  </header>
  <main class="container mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
